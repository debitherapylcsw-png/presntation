<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Spoon Theory Presentation - Slide 1 (Final Master)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: Garamond, serif; }
        
        /* CINEMATIC SPACE NEBULA BACKGROUND WITH BROWN ROUNDED BORDER */
        .workspace { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 20px 40px; 
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border: 12px solid #6b4e3d; 
            border-radius: 20px;
        }
        
        /* TOP LINKS NAVIGATION STRIP ROW */
        .top-links-bar { display: flex; justify-content: flex-start; align-items: center; gap: 30px; width: 100%; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .nav-header-label { font-size: 1.2rem; font-weight: bold; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; }
        .top-nav-link { font-size: 1.3rem; color: #ffffff; text-decoration: none; font-weight: normal; }
        .top-nav-link:hover, .top-nav-link.active { color: #38bdf8; font-weight: bold; }

        /* CENTRALIZED HEADER TYPOGRAPHY */
        .header-arena { text-align: center; width: 100%; margin-top: 10px; z-index: 10; }
        .branding-title { font-size: 3.5rem; font-weight: 900; letter-spacing: 4px; color: #ffffff; text-transform: uppercase; font-family: Impact, Arial Black, sans-serif; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }

        /* WIDESCREEN MID ARENA: Places bullet columns next to the reading character */
        .mid-arena { display: flex; width: 100%; flex: 1; align-items: center; justify-content: space-between; gap: 40px; padding: 10px 0; z-index: 5; }
        
        /* BOLD BORDERLESS FLOATING BULLETS ON LEFT */
        .bullet-column { flex: 1.4; display: flex; flex-direction: column; gap: 15px; }
        .teaching-bubble { display: flex; align-items: flex-start; gap: 12px; font-size: 1.8rem; line-height: 1.35; color: #ffffff; font-weight: bold; text-shadow: 2px 2px 8px rgba(0,0,0,0.9); }
        .custom-checkbox-icon { font-size: 1.7rem; color: #38bdf8; line-height: 1; margin-top: 2px; }

        /* SPOON CHARACTER CHOREOGRAPHY: Flipped to face left and look directly at his bullet text */
        .spoon-character-box { flex: 0.6; display: flex; justify-content: center; align-items: center; max-height: 75%; position: relative; overflow: hidden; }
        .spoon-avatar-media { 
            width: 100%; 
            height: auto; 
            max-height: 320px; 
            object-fit: contain;
            mix-blend-mode: multiply;
            clip-path: inset(2% 2% 8% 2% rounded 8px); 
            transform: scaleX(-1); /* FLIP CODE TRACK: Forces head to turn left toward the text */
        }
